<!DOCTYPE html>
<html>
    <head>
     
        <title>Register</title>
        <link rel="stylesheet" href="style.css" type="text/css">
         <link rel="icon" href="sample.png" type="text/css">
         <meta charset="UTF-8">
         <meta name="author" content="Sanjana Hegde">
         <meta name="description" content="This page allows users to register for the lost and found portal">
    </head>
    <body class="auth-page">
        <div class="auth-wrapper">
        <div class="auth-left">
            <h1>Lost&Found Portal</h1>
            <p>Report lost items,find belongings and reconnect owners with their valuables.</p>
        </div>
         
          <div class="auth-container">
             <h3>Register</h3>
        
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>

          <button type="button" onclick="register()">Register</button>
          <p class="auth-link">Already registered? <a href="login.html">Login</a></p>
          </div>
        </div>
        <div id="toast"></div>
          
          
          <script>
function register() {

    const user = {
        username: document.getElementById("username").value,
        email: document.getElementById("email").value,
        password: document.getElementById("password").value
    };

    if (!user.username || !user.email || !user.password) {
        showToast("Please fill all registration details");
        return;
    }

    fetch("http://localhost:5001/register", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(user)
    })

    .then(res => {
        if (!res.ok) {
            throw new Error("Failed");
        }
        return res.text();
    })

    .then(data => {
        localStorage.setItem("user", JSON.stringify({
            username: user.username,
            email: user.email
        }));
        showToast(data);
        setTimeout(() => window.location.href = "items.html", 700);
    })

    .catch(err => {
        console.log(err);
        showToast("Registration failed");
    });
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.innerText = message;
    toast.style.opacity = "1";
    setTimeout(() => toast.style.opacity = "0", 2200);
}
</script>
        
    </body>
</html>
